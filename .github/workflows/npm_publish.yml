# Publishes the package to GitHub Packages (npm.pkg.github.com) as a private package.
# Triggered manually via the "Run workflow" button on the master branch.
# Authentication uses the built-in GITHUB_TOKEN, so no extra secrets are required.
# Consumers must authenticate with a PAT that has `read:packages` scope (see docs/publishing.md).

name: Publish to GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: write # Required to push the release tag
  packages: write # Required to publish the package

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nodemodules-${{ hashFiles('yarn.lock') }}
          restore-keys: nodemodules-

      - name: Install Node packages
        run: yarn install

      - name: Build
        run: yarn build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # This command will automatically fail because of some common mistakes (this is a wanted behavior):
        # - The current version is already published
        # - The package uses a local directory as a dependency
        run: |
          version=$(node -p "require('./package.json').version")
          tag=$(echo "$version" | grep -oP '(?<=-)[^.]+' || echo "latest")
          echo "Publishing version $version with tag: $tag"
          npm publish --tag "$tag"

      - name: Create release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          git tag "v$version" 2>/dev/null || true
          git push origin "v$version" || echo "Tag v$version already exists, skipping"
